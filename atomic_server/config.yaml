name: "Atomic Server"
description: "Atomic Server running on Home Assistant"
# Doubles as the image tag: Home Assistant pulls `{image}:{version}`. `develop`
# is the only tag CI actually refreshes, so this tracks the current build.
#
# The previous value, `latest`, was a tag nobody publishes. The pipeline's
# metadata rules emit branch refs and semver only, and its publish step was
# gated to develop/master, so no release ever pushed an image. `latest` came
# from a one-off manual push in June 2026 and never moved again — this add-on
# has been serving a two-month-old server without any sign that it was.
#
# Trade-off: a rolling tag gives Home Assistant no version string to compare,
# so there is no update notification. Rebuild the add-on to pull a newer
# `develop`. Once the pipeline publishes version tags, pin a real one here.
version: "develop"
slug: "atomic_server"
url: "https://github.com/ontola/hassio-atomic-server"
arch:
  - aarch64

# GHCR, not Docker Hub: org-owned rather than tied to a personal account, and
# no anonymous pull rate limits. CI publishes to both during the transition;
# this is the one that is meant to outlive it.
image: "ghcr.io/ontola/atomic-server"
init: false
legacy: true
stage: experimental
startup: application
boot: auto

ports:
  9883/tcp: 9883
ports_description:
  9883/tcp: "Atomic Server HTTP"

webui: "http://[HOST]:[PORT:9883]/"
watchdog: "tcp://[HOST]:[PORT:9883]"

environment:
  ATOMIC_PORT: "9883"
  ATOMIC_IP: "::"
  ATOMIC_DOMAIN: "homeassistant.local"
  ATOMIC_DATA_DIR: "/data/atomic/data"
  ATOMIC_CONFIG_DIR: "/data/atomic/config"
  ATOMIC_CACHE_DIR: "/data/atomic/cache"
  ATOMIC_SKIP_VECTOR_INDEX: "true"

schema: false
